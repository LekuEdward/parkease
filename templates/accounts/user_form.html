{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="pe-page-header">
  <h1>👤 {{ title }}</h1>
  <p>Fill in all details to create a new ParkEase staff account.</p>
</div>

<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="pe-form-section">
      <div class="pe-form-section__title">🔐 Account Details</div>
      <form method="post">
        {% csrf_token %}
        {% crispy form %}
      </form>
    </div>
    <div class="mt-3">
      <a href="{% url 'accounts:user_list' %}" class="text-muted" style="font-size:13px">
        ← Back to Users
      </a>
    </div>
  </div>
</div>
{% endblock %}
